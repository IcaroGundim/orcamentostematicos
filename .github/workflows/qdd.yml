name: Coleta do QDD (SICAF)

# Puxa o QDD "Saldo Retroativo — Execução" (vTIPOREL=2) do SICAF/SEFAZ, baixa o Excel
# nativo e o entrega à rota /imports/qdd/from-sicaf do app, que o processa com o MESMO
# parser do upload manual e grava uma PRÉVIA. Em seguida pede a publicação automática
# (/imports/qdd/auto-publish), para o painel ficar atualizado sem intervenção.
#
# A publicação é CONDICIONAL: exercício ainda sem base, QDD encolhendo ou curadoria
# sumindo em massa fazem a rota recusar e deixar a prévia para a SEPLAN confirmar na
# tela. Ver docs/ingestao-qdd-sicaf.md.
#
# O BACKUP roda ANTES da coleta, e não só no backup.yml noturno: esta é uma escrita não
# vigiada em produção, num banco cuja retenção point-in-time é de ~6h. Sem o dump do dia
# imediatamente antes, um QDD ruim publicado às 05:00 só seria notado horas depois, já
# fora da janela de recuperação.
#
# Roda no Actions (não na Vercel) porque a raspagem depende de sessão GeneXus e do TLS
# da SEFAZ, como a coleta da folha. É idempotente: cada execução substitui a prévia do
# SICAF ainda não confirmada.

on:
  schedule:
    - cron: '0 10 * * 1-5' # dias úteis, 10:00 UTC (05:00 America/Rio_Branco)
  workflow_dispatch:
    inputs:
      exercicio:
        description: 'Exercício (ano) do QDD. Vazio = ano corrente.'
        required: false
      mes:
        description: 'Mês de referência 1-12 (acumulado até ele). Vazio = mês corrente.'
        required: false
      dry_run:
        description: 'true = só baixa e valida, não envia ao app'
        required: false
        default: 'false'

# Necessário para commitar o backup que precede a publicação.
permissions:
  contents: write

concurrency:
  group: coleta-qdd
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate
        working-directory: apps/web

      # Rede de segurança da escrita automática. Não roda no --dry-run, que não toca
      # no banco. Se o backup falhar, o job PARA aqui e nada é publicado: publicar sem
      # ponto de retorno é exatamente o que causou a perda de curadoria no passado.
      - name: Backup antes de publicar
        if: github.event.inputs.dry_run != 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node apps/web/scripts/backup.mjs

      # Não basta o script sair com 0: o que a publicação precisa é do dump EXISTINDO.
      # `backup.mjs` grava em backups/<AAAA-MM-DD> com a data em UTC (toISOString), a
      # mesma que `date -u` produz aqui. Sem esta conferência, a promessa de "não publica
      # sem backup" ficaria valendo só por confiança no exit code.
      - name: Conferir que o dump existe
        if: github.event.inputs.dry_run != 'true'
        run: |
          dump="backups/$(date -u +%Y-%m-%d)/curadoria.json"
          if [ ! -s "$dump" ]; then
            echo "::error::Backup ausente ou vazio em $dump — nada será publicado."
            exit 1
          fi
          echo "Backup conferido: $dump ($(wc -c < "$dump") bytes)."

      # `backup.yml` (06:00 UTC) e este job (10:00 UTC) escrevem no mesmo backups/<data>/,
      # então o push precisa tolerar que o outro tenha commitado antes — sem o rebase,
      # o segundo do dia falharia como non-fast-forward e travaria a coleta.
      - name: Commit do backup
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backups/
          if git diff --staged --quiet; then
            echo "Backup do dia já versionado."
          else
            git commit -m "chore(backup): antes da coleta do QDD $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Coletar QDD do SICAF
        env:
          APP_URL: ${{ secrets.APP_URL }}
          SICAF_CPF: ${{ secrets.SICAF_CPF }}
          SICAF_SENHA: ${{ secrets.SICAF_SENHA }}
          SICAF_JOB_TOKEN: ${{ secrets.SICAF_JOB_TOKEN }}
          SICAF_INSECURE_TLS: ${{ secrets.SICAF_INSECURE_TLS }}
          INPUT_EXERCICIO: ${{ github.event.inputs.exercicio }}
          INPUT_MES: ${{ github.event.inputs.mes }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          args=()
          if [ -n "$INPUT_EXERCICIO" ]; then args+=("--exercicio=$INPUT_EXERCICIO"); fi
          if [ -n "$INPUT_MES" ]; then args+=("--mes=$INPUT_MES"); fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then args+=("--dry-run"); fi
          node apps/web/scripts/fetch-sicaf-qdd.mjs "${args[@]}"

      - name: Guardar respostas de depuração (quando a coleta falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sicaf-debug
          path: apps/web/scripts/.sicaf-debug/
          if-no-files-found: ignore
          retention-days: 7
