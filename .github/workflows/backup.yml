name: Backup da curadoria temática

# Faz um backup versionado (commit em backups/) das tabelas críticas da curadoria.
# Roda diariamente e também sob demanda (workflow_dispatch) — dispare manualmente
# ANTES de qualquer mudança de schema/operação de risco no banco.

on:
  schedule:
    - cron: '0 6 * * *' # todo dia 06:00 UTC (03:00 America/Rio_Branco)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: backup-curadoria
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node apps/web/scripts/backup.mjs

      - name: Commit do backup
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backups/
          if git diff --staged --quiet; then
            echo "Sem mudanças no backup de hoje."
          else
            git commit -m "chore(backup): curadoria temática $(date -u +%Y-%m-%d)"
            git push
          fi
