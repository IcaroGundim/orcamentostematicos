:root {
  --marca: #2e6f40;
  --marca-contraste: #fcfcfc;
  --ink: #141714;
  --ink-2: #4a504b;
  --ink-3: #80857f;
  --hair: #e1e3dd;
  --band: #f5f6f2;
  --track: #ecede8;
  --st-budget: #6250d6;
  --st-committed: #eb6834;
  --st-liquidated: #2a78d6;
  --st-paid: #008300;
  --inc: #2a78d6;
  --red: #e34948;
  --other: #b9bbb4;
  --pad: 40px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: "Geist", ui-sans-serif, system-ui, "Segoe UI", sans-serif; color: var(--ink); background: #fff; font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
svg.i { width: 15px; height: 15px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg text { font-family: "Geist", ui-sans-serif, system-ui, sans-serif; }
.label { font-size: 11.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }
.sw { display: inline-block; width: 10px; height: 10px; margin-right: 8px; vertical-align: -1px; flex-shrink: 0; }

.mock { display: flex; gap: 16px; align-items: center; height: 28px; padding: 0 var(--pad); background: #141714; color: #c9ccc6; font-size: 12px; }
.mock b { color: #fff; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; font-size: 11px; }
.mock a { color: #fff; margin-left: auto; }
.gov { display: flex; align-items: center; gap: 20px; height: 56px; padding: 0 var(--pad); background: var(--marca); color: var(--marca-contraste); }
.gov img { height: 28px; }
.gov .t { font-size: 16px; font-weight: 600; }
.gov .back { color: var(--marca-contraste); opacity: .82; text-decoration: none; font-size: 13.5px; display: inline-flex; gap: 6px; align-items: center; }
.gov .right { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.gov .tb { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 0; background: none; color: var(--marca-contraste); cursor: pointer; font-size: 13.5px; }
.gov .tb.box { border: 1px solid rgba(252,252,252,.55); margin-right: 8px; }
.nav { display: flex; align-items: flex-end; gap: 32px; padding: 0 var(--pad); border-bottom: 1px solid var(--hair); background: #fff; position: sticky; top: 0; z-index: 20; }
.tab { border: 0; background: none; padding: 18px 0 14px; font-size: 15px; font-weight: 600; color: var(--ink-3); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--marca); }
.recorte { margin-left: auto; display: flex; align-items: baseline; gap: 16px; padding-bottom: 15px; }
.recorte button { border: 0; background: none; padding: 0 0 2px; font-size: 14px; color: var(--ink-3); cursor: pointer; border-bottom: 2px solid transparent; }
.recorte button[aria-pressed="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 14px var(--pad); border-bottom: 1px solid var(--hair); }
.sel { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 11px; border: 1px solid #c3c6bf; background: #fff; font-size: 13.5px; color: var(--ink-2); min-width: 150px; }
.sel span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sel.search { min-width: 280px; }
.sel.strong { border-color: var(--ink); color: var(--ink); }
.filters .clear { border: 0; background: none; color: var(--ink-3); font-size: 13.5px; }
.filters .state { margin-left: auto; color: var(--ink-3); font-size: 13px; }

.band { display: grid; grid-template-columns: 300px minmax(0, 1fr); column-gap: 64px; padding: 48px var(--pad); border-top: 1px solid var(--hair); }
.band.hero { background: var(--band); border-top: 0; padding-top: 40px; padding-bottom: 40px; }
.band .head h2 { margin: 6px 0 0; font-size: 21px; font-weight: 650; letter-spacing: -.01em; line-height: 1.25; }
.band .head p { margin: 10px 0 0; color: var(--ink-2); font-size: 14.5px; line-height: 1.55; }
.band .head .btns { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
.plain { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--ink); background: #fff; height: 34px; padding: 0 13px; font-size: 13.5px; cursor: pointer; }
.plain.soft { border-color: #c3c6bf; color: var(--ink-2); }
.body { min-width: 0; }
.hero .head .big { font-size: 64px; font-weight: 700; letter-spacing: -.03em; line-height: 1; margin-top: 14px; }
.hero .head .big small { font-size: 18px; font-weight: 500; letter-spacing: 0; color: var(--ink-2); margin-left: 6px; }
.hero .org { font-size: 26px; font-weight: 650; letter-spacing: -.015em; line-height: 1.2; margin-top: 6px; }
.aside { margin-top: 18px; font-size: 13.5px; color: var(--ink-2); }
.aside b { color: var(--ink); font-weight: 600; }
.ph { color: var(--ink-3); }
svg.chart { width: 100%; height: auto; display: block; overflow: visible; }

/* Tabela. */
.tw { overflow: auto; max-height: 640px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
thead th { position: sticky; top: 0; background: #fff; z-index: 1; text-align: right; padding: 0 12px 12px; border-bottom: 1px solid var(--ink); white-space: nowrap; }
thead th:first-child { text-align: left; padding-left: 0; }
tbody td { padding: 15px 12px; border-bottom: 1px solid var(--hair); text-align: right; white-space: nowrap; vertical-align: middle; }
tbody td:first-child { text-align: left; padding-left: 0; white-space: normal; }
tbody tr:hover td { background: #f8f9f6; }
.an b { display: block; font-weight: 550; }
.an small { display: block; color: var(--ink-3); font-size: 12.5px; margin-top: 3px; }
.ring { display: inline-flex; align-items: center; gap: 10px; }
.extra { display: none; }
body.all-cols .extra { display: table-cell; }
.tfoot { padding-top: 14px; font-size: 13px; color: var(--ink-3); }

/* Legendas e composições. */
.viz { display: grid; grid-template-columns: minmax(0, 1fr) 320px; column-gap: 48px; align-items: center; }
.leg { display: grid; gap: 10px; font-size: 14px; }
.leg .it { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: baseline; gap: 4px 0; }
.leg .it .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 12px; }
.leg .it .v { color: var(--ink-2); white-space: nowrap; }
.leg .it .v b { color: var(--ink); font-weight: 600; margin-left: 8px; }
.seqkey { display: flex; align-items: center; gap: 0; margin-top: 14px; font-size: 12px; color: var(--ink-2); }
.seqkey span { width: 44px; height: 10px; }
.seqkey em { font-style: normal; margin: 0 10px; }
.split3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 48px; }
.split { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 56px; }
h3.sub { margin: 0 0 16px; font-size: 15px; font-weight: 650; }
.waffle { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; max-width: 240px; }
.waffle i { display: block; aspect-ratio: 1; }
.figs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 32px; }
.figs .v { font-size: 30px; font-weight: 650; letter-spacing: -.015em; margin-top: 8px; white-space: nowrap; }
.figs .d { font-size: 13.5px; color: var(--ink-2); margin-top: 2px; }
.lolli { display: grid; gap: 16px; }
.lolli .it { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; align-items: center; font-size: 14px; }
.lolli .it .n { grid-column: 1 / -1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lolli .it .t { position: relative; height: 14px; }
.lolli .it .t::before { content: ""; position: absolute; left: 0; top: 6px; height: 2px; width: var(--w); background: #c3c6bf; }
.lolli .it .t::after { content: ""; position: absolute; top: 0; left: calc(var(--w) - 7px); width: 14px; height: 14px; border-radius: 50%; background: var(--c); }
.lolli .it .v { color: var(--ink-2); white-space: nowrap; }
.watch { display: grid; }
.watch div { display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--hair); font-size: 14px; }
.watch div:first-child { border-top: 1px solid var(--hair); }
.watch div span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.watch div span:last-child { text-align: right; color: var(--ink-2); }

.changes .chg { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 16px; padding: 12px 0; border-top: 1px solid var(--hair); font-size: 14px; }
.changes .k { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding-top: 3px; }
.changes .k.str { color: #a3461a; }
.changes .k.vis { color: var(--ink-3); }
.changes b { font-weight: 650; }
.changes p { margin: 2px 0 0; color: var(--ink-2); }

.tip { position: fixed; z-index: 80; pointer-events: none; background: var(--ink); color: #fff; padding: 9px 11px; font-size: 12.5px; line-height: 1.55; opacity: 0; max-width: 360px; }
.tip b { display: block; margin-bottom: 3px; }
.tip .row { display: flex; justify-content: space-between; gap: 18px; }
.view { display: none; }
.view.on { display: block; }

@media (max-width: 1180px) {
  :root { --pad: 24px; }
  .band { grid-template-columns: 1fr; row-gap: 24px; }
  .split3 { grid-template-columns: 1fr; row-gap: 36px; }
  .viz { grid-template-columns: 1fr; row-gap: 24px; }
  .gov .back span { display: none; }
}
</style>
</head>

const seqColor = (r) => SEQ[Math.min(4, Math.floor(r / 10))][0];
const seqInk = (r) => (r >= 20 ? '#fff' : '#141714');

const brl = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const money = (v) => brl.format(Math.round(v * 100) / 100 || 0).replace(/^-(R\$\s?0,00)$/, '$1');
const pct = (v) => `${(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 })}%`;
const int = (v) => v.toLocaleString('pt-BR');
const rate = (a, b) => (b ? (a / b) * 100 : 0);
function compact(v) {
  if (Math.abs(v) < 0.005) v = 0;
  if (v < 0) return `−${compact(-v)}`;
  const f = (x, d = 1) => x.toLocaleString('pt-BR', { maximumFractionDigits: d });
  if (v >= 1e9) return `R$ ${f(v / 1e9)} bi`;
  if (v >= 1e6) return `R$ ${f(v / 1e6)} mi`;
  if (v >= 1e3) return `R$ ${f(v / 1e3, 0)} mil`;
  return money(v);
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const tipAttr = (title, rows) => `data-tip='${esc(JSON.stringify({ title, rows })).replace(/'/g, '&#39;')}'`;
const tip = document.getElementById('tip');
document.addEventListener('mousemove', (e) => {
  const el = e.target.closest('[data-tip]');
  if (!el) { tip.style.opacity = 0; return; }
  const t = JSON.parse(el.dataset.tip);
  tip.innerHTML = `<b>${esc(t.title)}</b>` + t.rows.map(([l, v, c]) => `<div class="row"><span>${c ? `<i class="sw" style="background:${c}"></i>` : ''}${esc(l)}</span><span class="num">${esc(v)}</span></div>`).join('');
  tip.style.left = `${Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8)}px`;
  tip.style.top = `${Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 8)}px`;
  tip.style.opacity = 1;
});

const MINOR = new Set(['de', 'da', 'do', 'das', 'dos', 'e', 'a', 'o', 'em', 'para', 'com', 'à', 'ao', 'no', 'na', 'nos', 'nas', 'às', 'as', 'os', 'aos', 'pelo', 'pela']);
const ACRONYMS = new Set(['SEE', 'IEPTEC', 'FEM', 'FUNDEB', 'FUNCULTURA', 'SUS', 'SEAD', 'SESACRE', 'ALEAC', 'TCE', 'TJAC', 'MPAC', 'DPE', 'PMAC', 'PCAC', 'RPPS', 'ICMS', 'FUNDES', 'IPVA', 'SEGOV', 'TJ', 'AC', 'SPSM']);
function readable(name) {
  const fixed = String(name).replace('DESENVOLVI - MENTO', 'DESENVOLVIMENTO').replace(/([A-ZÀ-Ú])\(/g, '$1 (').replace(/\s+/g, ' ').trim();
  const parts = fixed.split(' - ');
  const tail = parts.length > 1 && parts[parts.length - 1].length <= 10 ? parts.pop() : null;
  const body = parts.join(' – ').toLowerCase().split(' ')
    .map((w, i) => w.split('-').map((part, j) => {
      const bare = part.toUpperCase().replace(/[^A-ZÀ-Ú]/g, '');
      if (ACRONYMS.has(bare)) return part.toUpperCase();
      if ((i > 0 || j > 0) && MINOR.has(part)) return part;
      if (part.startsWith('(')) return '(' + part.charAt(1).toUpperCase() + part.slice(2);
      return part.charAt(0).toUpperCase() + part.slice(1);
    }).join('-'))
    .join(' ').replace(/\.$/, '');
  return tail ? `${body} (${tail.toUpperCase()})` : body;
}
const dropCode = (label) => String(label).replace(/^\S+ — /, '');
const clip = (s, n) => (s.length > n ? s.slice(0, n - 1) + '…' : s);

let dim = 'geral', view = 'acoes';
function band(label, title, text, body, extra = '') {
  return `<section class="band"><div class="head"><div class="label">${label}</div><h2>${title}</h2>${text ? `<p>${text}</p>` : ''}${extra}</div><div class="body">${body}</div></section>`;
}

// Degraus do ciclo: uma coluna por estágio; a linha tracejada liga os topos e mostra a perda.
function steps(t) {
  const st = [
    ['Dotação atualizada', t.updatedBudget, S.budget, 'base da execução'],
    ['Empenhado', t.committed, S.committed, `${pct(rate(t.committed, t.updatedBudget))} da dotação`],
    ['Liquidado', t.liquidated, S.liquidated, `${pct(rate(t.liquidated, t.updatedBudget))} da dotação`],
    ['Pago', t.paid, S.paid, `${pct(rate(t.paid, t.liquidated))} do liquidado`],
  ];
  const W = 960, H = 300, top = 64, base = 238, colW = 120, gap = (W - colW * 4) / 4;
  const h = (v) => ((base - top) * v) / t.updatedBudget;
  let svg = `<line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="#141714"/>`;
  st.forEach(([l, v, c, d], i) => {
    const x = gap / 2 + i * (colW + gap), y = base - h(v);
    if (i > 0) {
      const px = gap / 2 + (i - 1) * (colW + gap) + colW, py = base - h(st[i - 1][1]);
      svg += `<path d="M${px} ${py} L${x} ${py} L${x} ${y}" fill="none" stroke="#9a9e98" stroke-dasharray="3 4"/>`;
      const lost = st[i - 1][1] - v;
      svg += `<text x="${x - gap / 2}" y="${py - 8}" text-anchor="middle" font-size="12" fill="#80857f">−${esc(compact(lost))}</text>`;
    }
    svg += `<rect x="${x}" y="${y}" width="${colW}" height="${Math.max(1, base - y)}" fill="${c}" ${tipAttr(l, [['Valor', money(v)], ['Leitura', d]])}/>`;
    svg += `<text x="${x + colW / 2}" y="${y - 12}" text-anchor="middle" font-size="22" font-weight="650" fill="#141714">${esc(compact(v))}</text>`;
    svg += `<text x="${x + colW / 2}" y="${base + 24}" text-anchor="middle" font-size="13" font-weight="600" fill="#141714">${l}</text>`;
    svg += `<text x="${x + colW / 2}" y="${base + 42}" text-anchor="middle" font-size="12.5" fill="#4a504b">${d}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ciclo da despesa">${svg}</svg>`;
}

// Anel pequeno da execução de uma linha.
function ring(r, size = 26) {
  const R = size / 2 - 3, c = 2 * Math.PI * R, v = Math.min(100, r);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size / 2}" cy="${size / 2}" r="${R}" fill="none" stroke="#ecede8" stroke-width="4"/><circle cx="${size / 2}" cy="${size / 2}" r="${R}" fill="none" stroke="${S.liquidated}" stroke-width="4" stroke-dasharray="${(c * v) / 100} ${c}" transform="rotate(-90 ${size / 2} ${size / 2})"/></svg>`;
}

// Rosca: fatias com a parcela de cada item; o centro diz o total.
function donut(items, total, center, sub, size = 240) {
  const R = size / 2 - 22, cx = size / 2, c = 2 * Math.PI * R;
  let acc = 0, arcs = '';
  items.forEach((it) => {
    const len = (c * it.value) / total;
    arcs += `<circle cx="${cx}" cy="${cx}" r="${R}" fill="none" stroke="${it.color}" stroke-width="34" stroke-dasharray="${Math.max(0, len - 2)} ${c}" stroke-dashoffset="${-acc}" transform="rotate(-90 ${cx} ${cx})" ${tipAttr(it.label, [['Valor', money(it.value)], ['Parcela', pct(rate(it.value, total))]])}/>`;
    acc += len;
  });
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img">${arcs}<text x="${cx}" y="${cx - 2}" text-anchor="middle" font-size="24" font-weight="700" fill="#141714">${esc(center)}</text><text x="${cx}" y="${cx + 20}" text-anchor="middle" font-size="12.5" fill="#4a504b">${esc(sub)}</text></svg>`;
}
function legend(items, total) {
  return `<div class="leg">${items.map((it) => `<div class="it"><i class="sw" style="background:${it.color}"></i><span class="n" title="${esc(it.label)}">${esc(it.label)}</span><span class="v num">${compact(it.value)}<b>${pct(rate(it.value, total))}</b></span></div>`).join('')}</div>`;
}
// Agrupa o que passa de n itens em "Demais", em cinza.
function topWithOther(rows, n, otherLabel) {
  const top = rows.slice(0, n).map((r, i) => ({ ...r, color: C[i] }));
  const rest = rows.slice(n).reduce((s, r) => s + r.value, 0);
  if (rest > 0) top.push({ label: otherLabel, value: rest, color: OTHER });
  return top;
}

// Mapa de áreas (squarified): área = dotação; cor = % executado ou categoria.
function treemap(items, W, H, colorOf, inkOf) {
  const total = items.reduce((s, it) => s + it.value, 0);
  const scaled = items.map((it) => ({ ...it, area: (it.value / total) * W * H }));
  const rects = [];
  let x = 0, y = 0, w = W, h = H, row = [], rest = scaled.slice();
  const worst = (r, side) => {
    const s = r.reduce((a, b) => a + b.area, 0), mx = Math.max(...r.map((q) => q.area)), mn = Math.min(...r.map((q) => q.area));
    return Math.max((side * side * mx) / (s * s), (s * s) / (side * side * mn));
  };
  const place = (r) => {
    const s = r.reduce((a, b) => a + b.area, 0);
    if (w >= h) { const cw = s / h; let yy = y; r.forEach((q) => { const qh = q.area / cw; rects.push({ ...q, x, y: yy, w: cw, h: qh }); yy += qh; }); x += cw; w -= cw; }
    else { const rh = s / w; let xx = x; r.forEach((q) => { const qw = q.area / rh; rects.push({ ...q, x: xx, y, w: qw, h: rh }); xx += qw; }); y += rh; h -= rh; }
  };
  while (rest.length) {
    const side = Math.min(w, h), next = [...row, rest[0]];
    if (!row.length || worst(next, side) <= worst(row, side)) { row = next; rest.shift(); }
    else { place(row); row = []; }
  }
  if (row.length) place(row);
  const cells = rects.map((r) => {
    const fill = colorOf(r), ink = inkOf(r);
    const big = r.w > 120 && r.h > 46, mid = r.w > 70 && r.h > 30;
    const name = esc(clip(r.short ?? r.label, Math.max(6, Math.floor(r.w / 7.4))));
    const text = big ? `<text x="${r.x + 10}" y="${r.y + 22}" font-size="13" font-weight="600" fill="${ink}">${name}</text><text x="${r.x + 10}" y="${r.y + 40}" font-size="12.5" fill="${ink}" opacity=".85">${esc(compact(r.value))}${r.rate != null ? ' · ' + esc(pct(r.rate)) : ''}</text>`
      : mid ? `<text x="${r.x + 8}" y="${r.y + 19}" font-size="12" font-weight="600" fill="${ink}">${esc(clip(r.short ?? r.label, Math.floor(r.w / 7.6)))}</text>` : '';
    const tipRows = [['Dotação atualizada', money(r.value)]];
    if (r.rate != null) tipRows.push(['Executado (liquidado)', pct(r.rate)]);
    return `<g ${tipAttr(r.label, tipRows)}><rect x="${r.x + 1}" y="${r.y + 1}" width="${Math.max(0, r.w - 2)}" height="${Math.max(0, r.h - 2)}" fill="${fill}"/>${text}</g>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${cells}</svg>`;
}
const seqLegend = `<div class="seqkey"><em>% executado</em>${SEQ.map(([c]) => `<span style="background:${c}"></span>`).join('')}<em>${SEQ[0][1]} → ${SEQ[4][1]}</em></div>`;

// Grade de 100 quadradinhos: cada um vale 1% do total.
function waffle(items, total) {
  const raw = items.map((it) => (it.value / total) * 100);
  const cells = raw.map(Math.floor);
  let left = 100 - cells.reduce((a, b) => a + b, 0);
  raw.map((r, i) => [r - Math.floor(r), i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if (left > 0) { cells[i]++; left--; } });
  const squares = items.flatMap((it, i) => Array.from({ length: cells[i] }, () => `<i style="background:${it.color}" ${tipAttr(it.label, [['Valor', money(it.value)], ['Parcela', pct(rate(it.value, total))]])}></i>`)).join('');
  return `<div class="waffle">${squares}</div>`;
}

// Pirulito: haste fina e ponto no valor — ranking sem barra cheia.
function lollipop(rows, nameOf, color, W = 900) {
  const rowH = 38, H = rows.length * rowH + 10, L = 300, Rt = 110;
  const max = Math.max(...rows.map((r) => r.value));
  const x = (v) => L + (v / max) * (W - L - Rt);
  const g = rows.map((r, i) => {
    const y = 18 + i * rowH;
    return `<g ${tipAttr(nameOf(r), [['Dotação atualizada', money(r.value)], ...(r.rate != null ? [['Executado', pct(r.rate)]] : [])])}><text x="0" y="${y + 5}" font-size="14" fill="#141714">${esc(clip(nameOf(r), 40))}</text><line x1="${L}" x2="${x(r.value)}" y1="${y}" y2="${y}" stroke="#c3c6bf" stroke-width="2"/><circle cx="${x(r.value)}" cy="${y}" r="7" fill="${color}"/><text x="${W}" y="${y + 5}" text-anchor="end" font-size="14" fill="#4a504b">${esc(compact(r.value))}</text></g>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"><line x1="${L}" x2="${L}" y1="0" y2="${H}" stroke="#141714"/>${g}</svg>`;
}

// Pirulito em HTML, para colunas estreitas: nome em cima, haste e ponto embaixo.
function lollipopList(rows, nameOf, color) {
  const max = Math.max(...rows.map((r) => r.value));
  return '<div class="lolli">' + rows.map((r) => '<div class="it" ' + tipAttr(nameOf(r), [['Dotação atualizada', money(r.value)], ...(r.rate != null ? [['Executado', pct(r.rate)]] : [])]) + '><span class="n" title="' + esc(nameOf(r)) + '">' + esc(nameOf(r)) + '</span><span class="t" style="--w:' + Math.max(2, (r.value / max) * 100) + '%;--c:' + color + '"></span><span class="v num">' + compact(r.value) + '</span></div>').join('') + '</div>';
}

// Halteres: dotação inicial (círculo vazado) → atualizada (cheio, azul se cresceu, vermelho se caiu).
function dumbbell(rows, changes, W = 900) {
  const rowH = 36, H = rows.length * rowH + 40, L = 110, Rt = 120;
  const max = Math.max(...rows.map((r) => Math.max(r.initialBudget, r.updatedBudget)));
  const x = (v) => L + (v / max) * (W - L - Rt);
  const flows = Object.fromEntries(changes.map((c) => [c.short, c]));
  const g = rows.map((r, i) => {
    const y = 20 + i * rowH, net = r.updatedBudget - r.initialBudget, c = net >= 0 ? 'var(--inc)' : 'var(--red)', f = flows[r.short];
    const tipRows = [['Dotação inicial', money(r.initialBudget)], ['Dotação atualizada', money(r.updatedBudget)], ['Saldo', money(net)]];
    if (f) tipRows.push(['Acréscimos (linhas)', money(f.increases)], ['Reduções (linhas)', money(f.reductions)]);
    return `<g ${tipAttr(r.label, tipRows)}><text x="0" y="${y + 5}" font-size="14" fill="#141714">${esc(r.short)}</text><line x1="${x(r.initialBudget)}" x2="${x(r.updatedBudget)}" y1="${y}" y2="${y}" stroke="${c}" stroke-width="3"/><circle cx="${x(r.initialBudget)}" cy="${y}" r="6" fill="#fff" stroke="#4a504b" stroke-width="2"/><circle cx="${x(r.updatedBudget)}" cy="${y}" r="7" fill="${c}"/><text x="${W}" y="${y + 5}" text-anchor="end" font-size="14" font-weight="600" fill="${net >= 0 ? '#1d5aa6' : '#b3302f'}">${net > 0.005 ? '+' : ''}${esc(compact(net))}</text></g>`;
  }).join('');
  const axis = [0, .25, .5, .75, 1].map((f) => `<line x1="${x(max * f)}" x2="${x(max * f)}" y1="0" y2="${H - 26}" stroke="#ecede8"/><text x="${x(max * f)}" y="${H - 8}" text-anchor="middle" font-size="12" fill="#80857f">${f ? esc(compact(max * f).replace('R$ ', '')) : '0'}</text>`).join('');
  return `<div class="leg" style="grid-auto-flow:column;justify-content:start;gap:24px;margin-bottom:12px;font-size:13.5px;color:var(--ink-2)"><span><svg width="14" height="14" style="vertical-align:-2px;margin-right:6px"><circle cx="7" cy="7" r="5" fill="#fff" stroke="#4a504b" stroke-width="2"/></svg>Dotação inicial (lei)</span><span><i class="sw" style="background:var(--inc);border-radius:50%"></i>Atualizada, cresceu</span><span><i class="sw" style="background:var(--red);border-radius:50%"></i>Atualizada, caiu</span></div><svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${axis}${g}</svg>`;
}

// Dispersão (mantida).
function scatter(rows) {
  const pts = rows.filter((r) => r.updatedBudget > 0).sort((a, b) => b.paid - a.paid);
  const W = 960, H = 380, P = { l: 46, r: 50, t: 28, b: 32 };
  const mx = Math.max(...pts.map((r) => r.updatedBudget)), mp = Math.max(...pts.map((r) => r.paid));
  const x = (v) => P.l + (v / mx) * (W - P.l - P.r), y = (v) => H - P.b - (Math.min(v, 100) / 100) * (H - P.t - P.b);
  const rad = (r) => 4 + Math.sqrt(r.paid / mp) * 18;
  const grid = [0, 25, 50, 75, 100].map((g) => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(g)}" y2="${y(g)}" stroke="${g ? '#e6e8e2' : '#141714'}"/><text x="${P.l - 10}" y="${y(g) + 4}" text-anchor="end" font-size="12" fill="#80857f">${g}%</text>`).join('');
  const xt = [0, .25, .5, .75, 1].map((f) => `<text x="${x(mx * f)}" y="${H - 8}" text-anchor="middle" font-size="12" fill="#80857f">${f ? esc(compact(mx * f).replace('R$ ', '')) : '0'}</text>`).join('');
  const dots = pts.map((r) => `<circle cx="${x(r.updatedBudget)}" cy="${y(r.rate)}" r="${rad(r)}" fill="${S.liquidated}" fill-opacity=".45" stroke="${S.liquidated}" ${tipAttr(r.label, [['Dotação atualizada', money(r.updatedBudget)], ['Execução', pct(r.rate)], ['Pago', money(r.paid)]])}/>`).join('');
  const lab = pts.slice(0, 6).map((r) => `<text x="${x(r.updatedBudget)}" y="${y(r.rate) - rad(r) - 6}" text-anchor="middle" font-size="13" font-weight="600" fill="#141714">${esc(r.short)}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${grid}${xt}${dots}${lab}</svg>`;
}

    .sort((a, b) => Math.abs(b.updatedBudget - b.initialBudget) - Math.abs(a.updatedBudget - a.initialBudget)).slice(0, 10);
  const changesBand = band('Créditos adicionais', 'Como a dotação mudou desde a lei',
    `Saldo de <b class="num">${net > 0.005 ? '+' : ''}${compact(net)}</b>. Por linha do QDD, que já vem líquida: <span class="num">${compact(inc)}</span> em acréscimos e <span class="num">${compact(-red)}</span> em reduções. Os órgãos com maior mudança, da lei à dotação atualizada.`,
    moved.length ? dumbbell(moved, d.changes) : '<p class="ph">Nenhuma alteração de dotação no recorte.</p>');
  if (dim === 'geral') {
    const el0 = d.element[0];
    const pts = d.organization.filter((r) => r.updatedBudget > 0);
    const low = pts.filter((r) => r.rate < 25).length;
    const srcItems = topWithOther(d.source.map((r) => ({ label: r.short, value: r.updatedBudget })), 6, 'Demais fontes');
    const srcTotal = srcItems.reduce((s, it) => s + it.value, 0);
    const elemItems = d.element.slice(0, 12).map((r) => ({ label: r.short, short: r.short, value: r.updatedBudget, rate: r.rate }));
    document.getElementById('view-graficos').innerHTML =
      band('Natureza da despesa', 'Para onde vai a despesa', `${esc(el0.short)} é o maior elemento, com <b class="num">${compact(el0.updatedBudget)}</b>. A área de cada bloco é a dotação; a cor, quanto já foi executado.`,
        treemap(elemItems, 960, 420, (r) => seqColor(r.rate), (r) => seqInk(r.rate)) + seqLegend) +
      band('Fonte de recurso', 'De onde vem o recurso', `${esc(srcItems[0].label)} financia <b class="num">${pct(rate(srcItems[0].value, srcTotal))}</b> da dotação. As seis maiores fontes e o restante.`,
        `<div class="viz"><div style="display:flex;justify-content:center">${donut(srcItems, srcTotal, compact(srcTotal), 'dotação atualizada', 300)}</div>${legend(srcItems, srcTotal)}</div>`) +
      band('Órgãos', 'Quem tem orçamento grande e execução baixa', `<b class="num">${low} de ${pts.length}</b> órgãos estão abaixo de 25% de execução. Cada círculo é um órgão; a área é o valor pago.`, scatter(d.organization)) +
      changesBand;
  } else {
    const byOrg = [...d.organization].sort((a, b) => b.updatedBudget - a.updatedBudget);
    const orgItems = byOrg.slice(0, 12).map((r, i) => ({ label: r.label, short: r.short, value: r.updatedBudget, i }));
    const elItems = topWithOther(d.element.map((r) => ({ label: r.short, value: r.updatedBudget })), 5, 'Demais elementos');
    const elTotal = elItems.reduce((s, it) => s + it.value, 0);
    document.getElementById('view-graficos').innerHTML =
      band('Emendas', 'Quem recebe as emendas', `${esc(byOrg[0].short)} lidera, com <b class="num">${compact(byOrg[0].updatedBudget)}</b> de ${compact(t.updatedBudget)}. A área de cada bloco é a dotação do órgão.`,
        treemap(orgItems, 960, 360, (r) => (r.i < 8 ? C[r.i] : OTHER), () => '#fff')) +
      band('Emendas', 'Maiores emendas', 'As oito ações de emenda com maior dotação atualizada.', lollipop(d.action.slice(0, 8).map((r) => ({ ...r, value: r.updatedBudget })), (r) => readable(dropCode(r.label)), S.budget)) +
      band('Emendas', 'Onde o dinheiro das emendas é aplicado', `${esc(elItems[0].label)} responde por <b class="num">${pct(rate(elItems[0].value, elTotal))}</b>.`,
        `<div class="viz"><div style="display:flex;justify-content:center">${donut(elItems, elTotal, compact(elTotal), 'em emendas', 300)}</div>${legend(elItems, elTotal)}</div>`) +
      changesBand;
  }
}

function renderOrgao() {
  const o = DATA.orgao, t = o.totals;
  const sigla = (o.name.match(/ - (\S+)$/) || [])[1] || o.code;
  const name = readable(o.name).replace(/ \(\S+\)$/, '');
  const liq = rate(t.liquidated, t.updatedBudget);
  const top2 = rate(o.units[0].value + o.units[1].value, t.updatedBudget);
  const zero = o.lowExecution.filter((r) => r.rate === 0);
  const pers = [{ label: 'Pessoal (GND 1 e auxílios)', value: o.personnel.updatedBudget, color: S.budget }, { label: 'Demais despesas', value: Math.max(0, t.updatedBudget - o.personnel.updatedBudget), color: OTHER }];
  const unitItems = o.units.map((u, i) => ({ label: readable(dropCode(u.label)), short: readable(dropCode(u.label)), value: u.value, i }));
  const catItems = o.category.map((c, i) => ({ label: readable(dropCode(c.label)), value: c.value, color: C[i] }));
  const srcItems = topWithOther(o.source.map((s) => ({ label: readable(dropCode(s.label)), value: s.value })), 4, 'Demais fontes');
  const srcTotal = srcItems.reduce((s, it) => s + it.value, 0);
  document.getElementById('view-orgao').innerHTML = `
    <div class="band hero" style="display:block;padding:18px var(--pad) 0"><div style="display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap"><span class="sel strong" style="min-width:260px"><span>Trocar secretaria</span><svg class="i" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></span><span class="sel"><span>Unidade: todas</span><svg class="i" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></span><button class="plain" type="button">Apresentar</button><button class="plain" type="button">Imprimir</button></div></div>
    <section class="band hero" style="padding-top:20px"><div class="head">
      <div class="label">${esc(sigla)} · órgão ${o.code} · acumulado até maio de 2026</div>
      <div class="org">${esc(name)}</div>
      <div class="big num">${pct(liq)}<small>executado</small></div>
      <p><b class="num">${compact(t.liquidated)}</b> liquidados de <span class="num">${compact(t.updatedBudget)}</span> autorizados, em ${int(o.count)} ações.</p>
      <p class="aside">Dotação inicial <b class="num">${compact(t.initialBudget)}</b><br>orçamento comprometido <b class="num">${pct(o.commitmentRate)}</b> (fonte 100)</p>
    </div><div class="body">${steps(t)}</div></section>
    ${band('Pessoal', `${pct(o.personnel.share)} do orçamento é pessoal`, 'GND 1 e auxílios das ações de folha do próprio órgão. A folha centralizada da SEAD e os vínculos do portal não estão nesta amostra.',
      `<div class="viz" style="grid-template-columns:260px minmax(0,1fr)"><div>${donut(pers, t.updatedBudget, pct(o.personnel.share), 'é pessoal', 240)}</div>
        <div><div class="figs">${[['Dotação de pessoal', o.personnel.updatedBudget, 'base'], ['Empenhado', o.personnel.committed, pct(rate(o.personnel.committed, o.personnel.updatedBudget)) + ' da dotação de pessoal'], ['Liquidado', o.personnel.liquidated, pct(rate(o.personnel.liquidated, o.personnel.updatedBudget)) + ' da dotação de pessoal']].map(([l, v, dd]) => `<div><div class="label">${l}</div><div class="v num">${compact(v)}</div><div class="d">${dd}</div></div>`).join('')}</div>
        <p class="aside">Vínculos ativos na folha: <b class="ph">[qtd]</b> — vêm do Portal da Transparência, fora desta amostra.</p></div></div>`)}
    ${band('Composição', 'Onde está o dinheiro', `Duas unidades concentram <b class="num">${pct(top2)}</b> da dotação. Três recortes, cada um na forma que lhe cabe.`,
      `<div class="split3">
        <div><h3 class="sub">Por unidade</h3><div style="max-width:460px">${treemap(unitItems, 400, 260, (r) => (r.i < 8 ? C[r.i] : OTHER), () => '#fff')}</div><div class="leg" style="margin-top:14px;font-size:13px">${unitItems.slice(0, 4).map((u) => `<div class="it"><i class="sw" style="background:${C[u.i]}"></i><span class="n" title="${esc(u.label)}">${esc(u.label)}</span><span class="v num">${pct(rate(u.value, t.updatedBudget))}</span></div>`).join('')}</div></div>
        <div><h3 class="sub">Por categoria econômica</h3><div style="display:flex;justify-content:center">${donut(catItems, t.updatedBudget, pct(rate(catItems[0].value, t.updatedBudget)), 'correntes', 220)}</div><div style="margin-top:14px">${legend(catItems, t.updatedBudget)}</div></div>
        <div><h3 class="sub">Por fonte de recurso</h3>${waffle(srcItems, srcTotal)}<p class="aside" style="margin:8px 0 14px">Cada quadrado é 1% da dotação.</p>${legend(srcItems, srcTotal)}</div>
      </div>`)}
    ${band('Ações', 'Maiores ações e o que precisa de atenção', 'Os cinco maiores orçamentos do órgão e, ao lado, as maiores dotações (sem emendas) que ainda não liquidaram nada.',
      `<div class="split"><div><h3 class="sub">Maiores orçamentos</h3>${lollipopList(o.topActions.slice(0, 5), (r) => readable(dropCode(r.label)), S.budget)}</div><div><h3 class="sub">Sem nenhum valor liquidado</h3><div class="watch">${zero.slice(0, 5).map((r) => `<div><span title="${esc(r.label)}">${esc(readable(dropCode(r.label)))}</span><span class="num">${compact(r.value)}</span></div>`).join('')}</div></div></div>`)}`;
}

function renderFolha() {
  document.getElementById('view-folha').innerHTML = `
    <section class="band hero"><div class="head"><div class="label">Portal da Transparência do Acre · somente dados agregados</div><div class="org">Folha de pagamento</div><div class="big ph">[valor]</div><p>de folha bruta em <span class="ph">[mês] de [ano]</span>, para <span class="ph">[qtd]</span> vínculos.</p></div>
      <div class="body"><div class="figs" style="grid-template-columns:repeat(4,minmax(0,1fr))">${['Vínculos', 'Folha bruta', 'Descontos', 'Folha líquida'].map((l) => `<div><div class="label">${l}</div><div class="v ph">[valor]</div></div>`).join('')}</div><p class="aside">Só a estrutura: a folha é coletada para o banco e não está nesta amostra local.</p></div></section>
    ${band('Distribuição', 'Quais órgãos pesam mais na folha', 'Rosca com os oito maiores órgãos e "Demais órgãos" em cinza.', '<p class="ph">[rosca + legenda com a parcela de cada órgão]</p>')}
    ${band('Vínculos', 'Por tipo de vínculo', 'Grade de quadradinhos: cada um vale 1% da folha bruta.', '<p class="ph">[grade por tipo de vínculo]</p>')}
    ${band('Carreiras', 'Maiores rendimentos médios', 'Ranking em pirulito, com busca e opção de incluir inativos.', '<p class="ph">[ranking de carreiras]</p>')}`;
}

function render() {
  const exec = view === 'orgao' || view === 'folha';
  document.getElementById('filters').style.display = exec ? 'none' : '';
  document.getElementById('recorte').style.visibility = exec ? 'hidden' : 'visible';
  renderHero(); renderAcoes(); renderGraficos(); renderOrgao(); renderFolha();
  document.querySelectorAll('.view').forEach((el) => el.classList.toggle('on', el.id === `view-${view}`));
}
document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => { view = b.dataset.view; document.querySelectorAll('.tab').forEach((x) => x.setAttribute('aria-selected', x === b)); render(); }));
document.querySelectorAll('#recorte button').forEach((b) => b.addEventListener('click', () => { dim = b.dataset.dim; document.querySelectorAll('#recorte button').forEach((x) => x.setAttribute('aria-pressed', x === b)); render(); }));

const CHANGES = [
  ['vis', 'Uma forma por tipo de dado, no lugar das barras de progresso', 'Ciclo da despesa em degraus (dotação → empenhado → liquidado → pago, com a perda entre um e outro); composição em mapa de áreas, rosca e grade de quadradinhos; ranking em pirulito; mudança da dotação em halteres (lei → atualizada); execução da linha da tabela num anel.'],
  ['vis', 'Faixas na largura toda', 'Título e conclusão à esquerda, a visualização à direita. Sem cartões, sombras ou cantos arredondados.'],
  ['vis', 'Mapa de áreas com duas leituras', 'Em "Para onde vai a despesa", a área é a dotação e a cor (uma rampa de azul) é quanto já foi executado.'],
  ['vis', 'Tabela enxuta', 'Dotação, liquidado e execução; "Mostrar todos os estágios" traz o resto. Nomes legíveis, com código, órgão e unidade numa linha de apoio.'],
  ['str', 'Recorte (Geral/Emendas) sai da trilha lateral', 'Vai para a linha das abas (R5, seção 3.2 do contrato).'],
  ['str', 'Filtros numa linha, sem trilha lateral', 'Muda R7. O seletor "Exibir valores de" sai; a tabela mostra os estágios por botão.'],
  ['str', 'Sem o zoom de 95% e com a página rolando inteira', 'Muda R6.'],
  ['str', 'O verde fica só na barra do governo e no sublinhado da aba ativa', 'Títulos de painel deixam de ser faixas verdes.'],
];
document.getElementById('mudancas').innerHTML = `<div class="head"><div class="label">Mockup</div><h2>O que muda</h2><p>Itens de estrutura mudam regras da seção 2 do contrato e precisam ser reescritas lá antes de aplicar.</p></div><div class="body">` +
  CHANGES.map(([k, t, p]) => `<div class="chg"><span class="k ${k}">${k === 'vis' ? 'Visual' : 'Estrutura'}</span><div><b>${t}</b><p>${p}</p></div></div>`).join('') + '</div>';
render();
</script>
</body>
</html>
